modLoader="javafml" #mandatory

loaderVersion="[47,)" #mandatory
license="LGPLv3"
[[mods]] #mandatory
modId="indestructible" #mandatory
version="${file.jarVersion}" #mandatory
displayName="EFI-unofficial" #mandatory

credits=""
authors="namelesslk, BlueLotusCoding"
description='''
Rebuilt to work with the latest Epic Fight version.
Now Lets you apply TACZ combat behavior to any compatible mob through datapack setup.
cnpcs gets quality-of-life upgrades
for CNPC x Epic Fight setups too. In addition to all this, there is also brand 
new conditions and behaviors that better enhance your advanced mob combat!
'''
# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.indestructible]] #optional
    # the modid of the dependency
    modId="forge" #mandatory
    # Does this dependency have to exist - if not, ordering below must be specified
    mandatory=true #mandatory
    # The version range of the dependency
    versionRange="[47,)" #mandatory
    # An ordering relationship for the dependency - BEFORE or AFTER required if the relationship is not mandatory
    ordering="NONE"
    # Side this dependency is applied on - BOTH, CLIENT or SERVER
    side="BOTH"
# Here's another dependency
[[dependencies.indestructible]]
    modId="minecraft"
    mandatory=true
# This version range declares a minimum of the current minecraft version up to but not including the next major version
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"
